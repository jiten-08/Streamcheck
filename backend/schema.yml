        description: A unique integer value identifying this invoice.
        required: true
      tags:
      - Invoices
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/movies/:
    get:
      operationId: v1_movies_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: featured
        schema:
          type: boolean
      - in: query
        name: max_duration
        schema:
          type: integer
      - in: query
        name: max_rating
        schema:
          type: number
      - in: query
        name: min_duration
        schema:
          type: integer
      - in: query
        name: min_rating
        schema:
          type: number
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: release_year
        schema:
          type: number
      - name: search
        required: false
        in: query
