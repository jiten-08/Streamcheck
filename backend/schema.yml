              $ref: '#/components/schemas/RecordWatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecordWatchRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchHistory'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchHistory'
          description: ''
  /api/v1/watchlist/:
    get:
      operationId: v1_watchlist_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
