components:
  schemas:
    ActivityEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        title:
          type: string
          maxLength: 160
        description:
          type: string
          maxLength: 300
        metadata: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event_type
      - id
