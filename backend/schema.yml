        schema:
          type: integer
      - in: query
        name: release_year
        schema:
          type: number
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Movie Details
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMovieList'
          description: ''
  /api/v1/reports/overview/:
    get:
      operationId: v1_reports_overview_retrieve
      parameters:
      - in: query
        name: activity_type
        schema:
          enum:
          - watched
          - profile
          - avatar
          - password
          - subscription
          type: string
          minLength: 1
        description: |-
          * `watched` - Watched
          * `profile` - Profile updated
          * `avatar` - Avatar updated
          * `password` - Password changed
          * `subscription` - Subscription purchased
      - in: query
        name: end_date
        schema:
          type: string
          format: date
      - in: query
        name: start_date
        schema:
          type: string
          format: date
      - in: query
        name: subscription_status
        schema:
          enum:
          - active
          - cancelled
          - expired
          type: string
          minLength: 1
        description: |-
          * `active` - Active
          * `cancelled` - Cancelled
          * `expired` - Expired
      tags:
      - Reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportsOverview'
          description: ''
