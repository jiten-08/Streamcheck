openapi: 3.0.3
info:
  title: StreamCheck API
  version: 1.0.0
  description: REST API for the StreamCheck media streaming platform.
paths:
  /api/v1/accounts/avatar/:
    post:
      operationId: v1_accounts_avatar_create
      description: Authentication and current-user account operations.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarUploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AvatarUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AvatarUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    delete:
      operationId: v1_accounts_avatar_destroy
      description: Authentication and current-user account operations.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/accounts/change-password/:
    post:
      operationId: v1_accounts_change_password_create
